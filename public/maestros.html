<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>Gestión de maestros</title>

<link rel="stylesheet" href="styles.css">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<div class="dashboard-container">

<!-- SIDEBAR -->

<aside class="sidebar">

<div>

<div class="logo">

<h2>Sistema Escolar</h2>

<p>Administrador</p>

</div>

<nav>

<a href="/dashboard_admin">

<i class="fa-solid fa-house"></i>
Inicio

</a>

<a href="/alumnos">

<i class="fa-solid fa-user-graduate"></i>
Alumnos

</a>

<a href="/maestros" class="active">

<i class="fa-solid fa-chalkboard-user"></i>
Maestros

</a>

<a href="/materias">

<i class="fa-solid fa-book"></i>
Materias

</a>

<a href="/grupos">

<i class="fa-solid fa-users"></i>
Grupos

</a>

<a href="/inscripciones">

<i class="fa-solid fa-pencil"></i>
Inscripciones

</a>

<a href="/evaluacion">

<i class="fa-solid fa-clipboard-check"></i>
Evaluación

</a>

<a href="/personal">

<i class="fa-solid fa-people-group"></i>
Personal

</a>

<a href="/configuracion">

<i class="fa-solid fa-gear"></i>
Configuración

</a>

</nav>

</div>

<button class="logout-btn"
onclick="window.location.href='/logout'">

<i class="fa-solid fa-right-from-bracket"></i>
Cerrar sesión

</button>

</aside>

<!-- CONTENIDO -->

<main class="main-content">

<div class="topbar">

<div>

<h1>Gestión de maestros</h1>

<p>Administrar maestros del sistema</p>

</div>

<button
class="add-btn"
onclick="abrirModal()">

<i class="fa-solid fa-plus"></i>
Agregar maestro

</button>

</div>

<!-- TABLA -->

<div class="tabla-container">

<table>

<thead>

<tr>

<th>Nombre</th>
<th>Correo</th>
<th>Especialidad</th>
<th>Estado</th>
<th>Acciones</th>

</tr>

</thead>

<tbody id="tablaMaestros">

</tbody>

</table>

</div>

</main>

</div>

<!-- MODAL -->

<div class="modal" id="modal">

<div class="modal-content">

<h2>Nuevo maestro</h2>

<form id="formMaestro">

<input
type="text"
name="nombre"
placeholder="Nombre"
required>

<input
type="email"
name="correo"
placeholder="correo"
required>

<input
type="text"
name="especialidad"
placeholder="Especialidad"
required>

<select name="estado" required>
    <option value="activo">Activo</option>
    <option value="inactivo">Inactivo</option>
    <option value="suspendido">Suspendido</option>
</select>

<div class="modal-buttons">

<button
type="button"
class="cancel-btn"
onclick="cerrarModal()">

Cancelar

</button>

<button
type="submit"
class="save-btn">

Guardar

</button>

</div>

</form>

</div>

</div>

<script src="permisos.js"></script>

<script>

let maestroEditando = null;

function estadoBadge(estado){
    const activo = estado === "activo";
    const clase = activo ? "active-status" : "inactive-status";
    const texto = estado === "suspendido" ? "Suspendido" : activo ? "Activo" : "Inactivo";
    return `
    <span class="status-badge ${clase}">
        <i class="fa-solid fa-circle"></i>
        ${texto}
    </span>`;
}

// CARGAR MAESTROS

async function cargarMaestros(){

    const res =
    await fetch("/api/maestros");

    const maestros =
    await res.json();

    const tabla =
    document.getElementById("tablaMaestros");

    tabla.innerHTML = "";

    maestros.forEach(maestro => {

        tabla.innerHTML += `

        <tr>

            <td>${maestro.nombre}</td>

            <td>${maestro.correo}</td>

            <td>${maestro.especialidad}</td>

            <td>${estadoBadge(maestro.estado || (maestro.activo !== false ? "activo" : "inactivo"))}</td>
        

            <td>

                <button
class="view-btn"
onclick="verMaestro('${maestro._id}')">

Ver

</button>

                <button
class="reset-btn"
onclick="resetearContrasenaMaestro('${maestro._id}')">

Reset contraseña

</button>

                <button
class="edit-btn"
onclick="editarMaestro(
'${maestro._id}',
'${maestro.nombre}',
'${maestro.correo}',
'${maestro.especialidad}',
'${maestro.estado || (maestro.activo !== false ? "activo" : "inactivo")}'
)">

Editar

</button>

<button
class="delete-btn"
onclick="eliminarMaestro('${maestro._id}')">

Eliminar

</button>
            </td>

        </tr>

        `;

    });

}

// AGREGAR MAESTRO
document.getElementById("formMaestro")
.addEventListener("submit",
async e => {

    e.preventDefault();

    const form =
    new FormData(e.target);

    const datos =
    Object.fromEntries(form);
    datos.estado = form.get("estado") || "activo";

    // EDITAR

    if(maestroEditando){

        await fetch(

        `/api/maestros/${maestroEditando}`,

        {

            method:"PUT",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify(datos)

        });

        maestroEditando = null;

    }

    // CREAR

    else{

        const respuesta = await fetch("/api/maestros", {

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify(datos)

        });

        const resultado = await respuesta.json();

        if(!respuesta.ok){
            alert(resultado.error || "Error creando maestro");
            return;
        }

        alert(`Maestro registrado correctamente. Usuario: ${resultado.usuario}. Contraseña temporal: ${resultado.contrasenaTemporal}`);

    }

    cerrarModal();

    cargarMaestros();

    e.target.reset();

});

// ELIMINAR

async function eliminarMaestro(id){

    if(!confirm("¿Eliminar maestro?"))
    return;

    await fetch(`/api/maestros/${id}`, {

        method:"DELETE"

    });

    cargarMaestros();

}

async function resetearContrasenaMaestro(id){
    if(!confirm("¿Restablecer la contraseña temporal del maestro?"))
    return;

    const res = await fetch(`/api/maestros/${id}/reset-password`, {
        method: "POST"
    });

    if(!res.ok){
        const msg = await res.json().catch(() => ({}));
        alert(msg.error || "No se pudo restablecer la contraseña.");
        return;
    }

    const data = await res.json();
    alert(`Contraseña restablecida. Usuario: ${data.usuario}. Nueva contraseña temporal: ${data.contrasenaTemporal}`);
    cargarMaestros();
}

async function verMaestro(id){
    const res = await fetch(`/api/maestros/${id}`);
    if(!res.ok){
        alert("No se encontró el maestro.");
        return;
    }
    const maestro = await res.json();
    alert(`Maestro: ${maestro.nombre}\nCorreo: ${maestro.correo}\nEspecialidad: ${maestro.especialidad}\nEstado: ${maestro.estado || 'activo'}`);
}

// MODAL

function abrirModal(){

    document
    .getElementById("modal")
    .style.display = "flex";

}

function cerrarModal(){

    document
    .getElementById("modal")
    .style.display = "none";

}
 

function editarMaestro(
id,
nombre,
correo,
    especialidad,
    estado
){

    maestroEditando = id;

    abrirModal();

    document.querySelector(
    '[name="nombre"]'
    ).value = nombre;

    document.querySelector(
    '[name="correo"]'
    ).value = correo;

    document.querySelector(
    '[name="especialidad"]'
    ).value = especialidad;

    document.querySelector(
    '[name="estado"]'
    ).value = estado || "activo";
}

cargarMaestros();

</script>

</body>
</html>
