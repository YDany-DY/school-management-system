<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<link rel="stylesheet" href="styles.css">

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<div class="dashboard-container">

Alumnos

<a href="/maestros">

Maestros

</a>

<a href="/materias">

<i class="fa-solid fa-book"></i>
Materias

</a>

<a href="/grupos">

<i class="fa-solid fa-users"></i>
Grupos

</a>

<a href="/inscripciones">

<i class="fa-solid fa-pencil"></i>
Inscripciones

</a>

<a href="/evaluacion">

<i class="fa-solid fa-clipboard-check"></i>

</a>

Personal

</div>

onclick="window.location.href='/logout'">

<i class="fa-solid fa-right-from-bracket"></i>
Cerrar sesión

</button>

</aside>

<!-- CONTENIDO -->

<main class="main-content">

<div class="topbar">

<div>

<h1>Gestión de alumnos</h1>

<p>Administrar alumnos del sistema</p>

</div>

<button
class="add-btn"
onclick="abrirModal()">

<i class="fa-solid fa-plus"></i>
Agregar alumno

</button>

</div>

<div id="alumnoMensaje" class="form-feedback"></div>

<!-- TABLA -->

<div class="tabla-container">

<table>

<thead>

<tr>

<th>Nombre</th>
<th>Matrícula</th>
<th>Correo</th>
<th>Grupo</th>
<th>Carrera</th>
<th>Semestre</th>
<th>Estado</th>
<th>Acciones</th>

</tr>

</thead>

<tbody id="tablaAlumnos">

</tbody>

</table>

</div>

</main>

</div>

<!-- MODAL -->

<div class="modal" id="modal">

<div class="modal-content">

<h2>Nuevo alumno</h2>

<form id="formAlumno">

<input
type="text"
name="nombre"
placeholder="Nombre"
required>

<input
type="text"
name="matricula"
placeholder="Matrícula"
required>

<input
type="email"
name="correo"
placeholder="Correo">

<select
name="grupoId"
id="grupoAlumnoSelect">
<option value="">Sin grupo asignado</option>
</select>

<input
type="text"
name="carrera"
placeholder="Carrera"
required>

<input
type="number"
name="semestre"
placeholder="Semestre"
required>

<select name="estado" required>
    <option value="activo">Activo</option>
    <option value="inactivo">Inactivo</option>
    <option value="suspendido">Suspendido</option>
</select>

<div class="modal-buttons">

<button
type="button"
class="cancel-btn"
onclick="cerrarModal()">

Cancelar

</button>

<button
type="submit"
class="save-btn">

Guardar

</button>

</div>

</form>

</div>

</div>

<div class="modal" id="credencialModal">

<div class="modal-content">

<h2>Credenciales temporales</h2>

<div class="input-group">
    <label>Usuario</label>
    <input type="text" id="credencialUsuario" readonly>
</div>

<div class="input-group">
    <label>Contraseña temporal</label>
    <input type="text" id="credencialPassword" readonly>
</div>

<button type="button" class="copy-btn" onclick="copiarCredencial()">Copiar contraseña</button>

<button type="button" class="save-btn" onclick="cerrarCredencialModal()">

Cerrar

</button>

</div>

</div>

<script src="permisos.js"></script>

<script>

let alumnoEditando = null;
let gruposAlumno = [];

function estadoBadge(activo, textoActivo = "Activo", textoInactivo = "Inactivo"){

    const clase =
    activo ? "active-status" : "inactive-status";

    const texto =
    activo ? textoActivo : textoInactivo;

    return `
    <span class="status-badge ${clase}">
        <i class="fa-solid fa-circle"></i>
        ${texto}
    </span>`;

}

async function cargarOpcionesAlumno(){

    const res =
    await fetch("/api/alumnos/opciones");

    const data =
    await res.json();

    gruposAlumno =
    data.grupos || [];

    const select =
    document.getElementById("grupoAlumnoSelect");

    select.innerHTML =
    '<option value="">Sin grupo asignado</option>';

    gruposAlumno.forEach(grupo => {

        select.innerHTML += `
        <option value="${grupo._id}">
            ${grupo.nombre} · ${grupo.carrera || "General"}
        </option>`;

    });

}

function nombreGrupo(grupo){

    if(!grupo){
        return "Sin grupo";
    }

    if(typeof grupo === "object"){
        return grupo.nombre || "Sin grupo";
    }

    const encontrado =
    gruposAlumno.find(item => item._id === grupo);

    return encontrado ? encontrado.nombre : "Sin grupo";

}

// CARGAR ALUMNOS

async function cargarAlumnos(){

    const res =
    await fetch("/api/alumnos");

    if (!res.ok) {
        mostrarAlumnoMensaje("Error cargando alumnos", "error");
        return;
    }

    const alumnos =
    await res.json();

    const tabla =
    document.getElementById("tablaAlumnos");

    tabla.innerHTML = "";

    alumnos.forEach(alumno => {

        const grupoId = alumno.grupoId && typeof alumno.grupoId === "object" 
            ? alumno.grupoId._id 
            : (alumno.grupoId || "");
        
        const estado = alumno.estado || (alumno.activo !== false ? "activo" : "inactivo");
        
        // Convertir _id a string para asegurar que se asigna correctamente
        const alumnoId = String(alumno._id || "");

        tabla.innerHTML += `

        <tr>

            <td>${alumno.nombre}</td>

            <td>${alumno.matricula}</td>

            <td>${alumno.correo || "Sin correo"}</td>

            <td>${nombreGrupo(alumno.grupoId)}</td>

            <td>${alumno.carrera}</td>

            <td>${alumno.semestre}</td>

            <td>${estadoBadge(estado)}</td>

            <td>

                <button
class="edit-btn"
data-alumno-id="${alumnoId}"
data-alumno-nombre="${(alumno.nombre || "").replace(/"/g, '&quot;')}"
data-alumno-matricula="${(alumno.matricula || "").replace(/"/g, '&quot;')}"
data-alumno-correo="${(alumno.correo || "").replace(/"/g, '&quot;')}"
data-alumno-carrera="${(alumno.carrera || "").replace(/"/g, '&quot;')}"
data-alumno-semestre="${alumno.semestre || ""}"
data-alumno-grupo="${grupoId}"
data-alumno-estado="${estado}"
onclick="editarAlumnoDesdeBtn(this)">

Editar

</button>

<button
class="reset-btn"
data-alumno-id="${alumnoId}"
onclick="resetearContrasenaAlumno(this)">

Reset contraseña

</button>

<button
class="delete-btn"
data-alumno-id="${alumnoId}"
onclick="eliminarAlumno(this)">

Eliminar

</button>
            </td>

        </tr>

        `;

    });

}

// AGREGAR ALUMNO

function mostrarAlumnoMensaje(texto, tipo = "success") {
    const mensaje = document.getElementById("alumnoMensaje");
    mensaje.innerText = texto;
    mensaje.className = `form-feedback ${tipo}`;
}

function limpiarAlumnoMensaje() {
    const mensaje = document.getElementById("alumnoMensaje");
    mensaje.innerText = "";
    mensaje.className = "form-feedback";
}

document.getElementById("formAlumno")
.addEventListener("submit",
async e => {

    e.preventDefault();

    const form =
    new FormData(e.target);

    const datos =
    Object.fromEntries(form);

    datos.estado = form.get("estado") || "activo";

    limpiarAlumnoMensaje();

    // EDITAR

    if(alumnoEditando){

        try {
            const respuesta = await fetch(

            `/api/alumnos/${alumnoEditando}`,

            {

                method:"PUT",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify(datos)

            });

            const resultado = await respuesta.json();

            if(!respuesta.ok){
                mostrarAlumnoMensaje(resultado.error || "Error actualizando alumno", "error");
                return;
            }

            mostrarAlumnoMensaje(resultado.mensaje || "Alumno actualizado correctamente");

            cerrarModal();
            cargarAlumnos();
            e.target.reset();
            alumnoEditando = null;
        } catch (error) {
            console.error("Error:", error);
            mostrarAlumnoMensaje("Error de conexión al actualizar alumno", "error");
        }

    }

    // CREAR

    else{

        try {
            const respuesta = await fetch("/api/alumnos", {

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify(datos)

            });

            const resultado = await respuesta.json();

            if (!respuesta.ok) {
                mostrarAlumnoMensaje(resultado.error || "Error creando alumno", "error");
                return;
            }

            const usuarioTemporal = resultado.usuario || datos.matricula || "Alumno";
            const contrasenaTemporal = resultado.contrasenaTemporal || "";

            mostrarAlumnoMensaje(
                `Alumno registrado correctamente. Copia la contraseña temporal antes de cerrar.`
            );

            mostrarCredencialModal(usuarioTemporal, contrasenaTemporal, "Este usuario deberá cambiarla en su primer acceso.");

            cerrarModal();
            cargarAlumnos();
            e.target.reset();
        } catch (error) {
            console.error("Error:", error);
            mostrarAlumnoMensaje("Error de conexión al crear alumno", "error");
        }

    }

});

// ELIMINAR

async function eliminarAlumno(btn) {
    const id = btn.getAttribute("data-alumno-id");
    
    console.log("ID obtenido del botón:", id);
    
    if (!id || id.trim() === "") {
        mostrarAlumnoMensaje("Error: ID de alumno no válido", "error");
        return;
    }
    
    if (!confirm("¿Eliminar alumno? Esta acción no se puede deshacer.")) {
        return;
    }

    limpiarAlumnoMensaje();
    
    try {
        const url = `/api/alumnos/${id}`;
        console.log("Enviando DELETE a:", url);
        
        const respuesta = await fetch(url, {
            method: "DELETE"
        });

        console.log("Respuesta status:", respuesta.status);

        const resultado = await respuesta.json();
        console.log("Resultado:", resultado);

        if (!respuesta.ok) {
            mostrarAlumnoMensaje(resultado.error || "Error eliminando alumno", "error");
            return;
        }

        mostrarAlumnoMensaje(resultado.mensaje || "Alumno eliminado correctamente");
        cargarAlumnos();
    } catch (error) {
        console.error("Error al eliminar:", error);
        mostrarAlumnoMensaje("Error de conexión al eliminar alumno: " + error.message, "error");
    }
}

// RESET CONTRASEÑA

async function resetearContrasenaAlumno(btn) {
    const id = btn.getAttribute("data-alumno-id");
    
    if (!id || !confirm("¿Restablecer contraseña temporal para este alumno?")) {
        return;
    }

    limpiarAlumnoMensaje();

    try {
        const respuesta = await fetch(`/api/alumnos/${id}/reset-password`, {
            method: "POST"
        });

        const resultado = await respuesta.json();

        if (!respuesta.ok) {
            mostrarAlumnoMensaje(resultado.error || "Error restableciendo contraseña", "error");
            return;
        }

        const usuarioTemporal = resultado.usuario || "Alumno";
        const contrasenaTemporal = resultado.contrasenaTemporal || "";

        mostrarAlumnoMensaje(
            `Contraseña temporal restablecida. Copia el código y entrégalo al alumno.`
        );

        mostrarCredencialModal(usuarioTemporal, contrasenaTemporal, "El alumno deberá cambiar esta contraseña en su primer acceso.");
    } catch (error) {
        console.error("Error:", error);
        mostrarAlumnoMensaje("Error de conexión al restablecer contraseña", "error");
    }
}

// MODAL

function abrirModal(nuevo = true){

    if(nuevo){
        alumnoEditando = null;

        // Cambiar título del modal
        document.querySelector('#modal h2').innerText = "Nuevo alumno";

        document
        .getElementById("formAlumno")
        .reset();
    }

    document
    .getElementById("modal")
    .style.display = "flex";

}

function cerrarModal(){

    document
    .getElementById("modal")
    .style.display = "none";

    limpiarAlumnoMensaje();

}
function mostrarCredencialModal(usuario, contrasena, nota) {
    usuario = usuario || "Alumno";
    contrasena = contrasena || "No disponible";
    document.getElementById("credencialUsuario").value = usuario;
    document.getElementById("credencialPassword").value = contrasena;
    document.getElementById("credencialModal").style.display = "flex";
}

function copiarCredencial() {
    const passwordInput = document.getElementById("credencialPassword");
    passwordInput.select();
    passwordInput.setSelectionRange(0, 99999);
    document.execCommand("copy");
    alert("Contraseña temporal copiada al portapapeles");
}

function cerrarCredencialModal() {
    document.getElementById("credencialModal").style.display = "none";
}
function editarAlumno(
id,
nombre,
matricula,
correo,
carrera,
semestre,
grupoId,
estado
){

    alumnoEditando = id;

    // Cambiar título del modal
    document.querySelector('#modal h2').innerText = "Editar alumno";

    abrirModal(false);

    document.querySelector(
    '[name="nombre"]'
    ).value = nombre;

    document.querySelector(
    '[name="matricula"]'
    ).value = matricula;

    document.querySelector(
    '[name="correo"]'
    ).value = correo;

    document.querySelector(
    '[name="carrera"]'
    ).value = carrera;

    document.querySelector(
    '[name="semestre"]'
    ).value = semestre;

    document.querySelector(
    '[name="grupoId"]'
    ).value = grupoId || "";

    document.querySelector(
    '[name="estado"]'
    ).value = estado || "activo";

}

// Nueva función para editar desde el botón con data-attributes
function editarAlumnoDesdeBtn(btn) {
    const id = btn.getAttribute("data-alumno-id");
    const nombre = btn.getAttribute("data-alumno-nombre") || "";
    const matricula = btn.getAttribute("data-alumno-matricula") || "";
    const correo = btn.getAttribute("data-alumno-correo") || "";
    const carrera = btn.getAttribute("data-alumno-carrera") || "";
    const semestre = btn.getAttribute("data-alumno-semestre") || "";
    const grupo = btn.getAttribute("data-alumno-grupo") || "";
    const estado = btn.getAttribute("data-alumno-estado") || "activo";

    editarAlumno(id, nombre, matricula, correo, carrera, semestre, grupo, estado);
}
// INICIAR

Promise
.all([
    cargarOpcionesAlumno(),
    cargarAlumnos()
])
.catch(error => {
    mostrarAlumnoMensaje(error.message || "No se pudo cargar alumnos", "error");
});

</script>

</body>
</html>
