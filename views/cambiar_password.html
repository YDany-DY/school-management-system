<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar contraseña</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
<div class="dashboard-container">
    <aside class="sidebar">
        <div>
            <div class="logo">
                <h2>Sistema Escolar</h2>
                <p>Seguridad</p>
            </div>
            <nav>
                <a href="/dashboard_personal">
                    <i class="fa-solid fa-house"></i>
                    Inicio
                </a>
            </nav>
        </div>
    </aside>
    <main class="main-content">
        <div class="topbar">
            <div>
                <h1>Cambiar contraseña</h1>
                <p>Actualiza tu contraseña para continuar con el acceso.</p>
            </div>
            <div class="profile-icon">
                <i class="fa-solid fa-shield-keyhole"></i>
            </div>
        </div>
        <section class="dashboard-section">
            <div class="section-heading">
                <h2>Contraseña temporal</h2>
                <p>Ingresa una nueva contraseña segura y confirma para activar tu acceso.</p>
            </div>
            <form id="cambiarPasswordForm" class="form-card">
                <div class="form-group">
                    <label for="password">Nueva contraseña</label>
                    <input id="password" name="password" type="password" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirmar contraseña</label>
                    <input id="confirmPassword" name="confirmPassword" type="password" required>
                </div>
                <button type="submit" class="btn-primary">Actualizar contraseña</button>
                <p id="cambiarMensaje" class="form-feedback"></p>
            </form>
        </section>
    </main>
</div>
<script src="/js/cambiar_password.js"></script>
</body>
</html>
